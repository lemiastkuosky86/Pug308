
name: Compilar Peugeot 308 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: APK assinado para Jancar
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      PEUGEOT_KEYSTORE_BASE64: ${{ secrets.PEUGEOT_KEYSTORE_BASE64 }}
      PEUGEOT_KEYSTORE_PASSWORD: ${{ secrets.PEUGEOT_KEYSTORE_PASSWORD }}
      PEUGEOT_KEY_ALIAS: ${{ secrets.PEUGEOT_KEY_ALIAS }}
      PEUGEOT_KEY_PASSWORD: ${{ secrets.PEUGEOT_KEY_PASSWORD }}

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar chave original obrigatoria
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            PEUGEOT_KEYSTORE_BASE64 \
            PEUGEOT_KEYSTORE_PASSWORD \
            PEUGEOT_KEY_ALIAS \
            PEUGEOT_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "ERRO: Secret ausente: $name"
              exit 1
            fi
          done

          printf '%s' "$PEUGEOT_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/peugeot-original.keystore"

          chmod 600 "$RUNNER_TEMP/peugeot-original.keystore"

          echo "PEUGEOT_KEYSTORE_FILE=$RUNNER_TEMP/peugeot-original.keystore" >> "$GITHUB_ENV"

          echo "Chave original preparada."

      - name: Compilar APK com chave original
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificar assinatura do APK final
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK" \
            > "$RUNNER_TEMP/apk-verification.txt"

          ACTUAL=$(sed -n \
            's/^Signer #1 certificate SHA-256 digest: //p' \
            "$RUNNER_TEMP/apk-verification.txt" \
            | head -n1 \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d ':[:space:]')

          EXPECTED="531C7DF8FBCB6750AD96607D38179EFA62989575C57C20185895E9AE69D62752"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "ERRO: Assinatura diferente da original."
            echo "O APK nao sera publicado."
            exit 1
          fi

          echo "Assinatura original validada com sucesso."

      - name: Renomear APK pela versao instalada
        id: rename_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          PACKAGE=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:')
          VERSION=$(sed -nE "s/.*versionName='([^']+)'.*/\1/p" <<< "$PACKAGE")
          CODE=$(sed -nE "s/.*versionCode='([^']+)'.*/\1/p" <<< "$PACKAGE")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ || ! "$CODE" =~ ^[0-9]+$ ]]; then
            echo "ERRO: versao ou codigo do APK invalido: $PACKAGE"
            exit 1
          fi
          mkdir -p dist
          FILE_NAME="308 Launcher V${VERSION}.apk"
          cp "$APK" "dist/$FILE_NAME"
          printf '{"versionCode":%s,"versionName":"%s","apk":"%s"}\n' "$CODE" "$VERSION" "$FILE_NAME" > dist/update.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK final: dist/$FILE_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/$FILE_NAME" | grep -F "application-label:'308 Launcher'"

      - name: Publicar APK validado
        uses: actions/upload-artifact@v4
        with:
          name: 308 Launcher V${{ steps.rename_apk.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
