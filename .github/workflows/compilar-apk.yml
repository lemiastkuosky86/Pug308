name: Compilar Peugeot 308 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    env:
      PEUGEOT_KEYSTORE_BASE64: ${{ secrets.PEUGEOT_KEYSTORE_BASE64 }}
      PEUGEOT_KEYSTORE_PASSWORD: ${{ secrets.PEUGEOT_KEYSTORE_PASSWORD }}
      PEUGEOT_KEY_ALIAS: ${{ secrets.PEUGEOT_KEY_ALIAS }}
      PEUGEOT_KEY_PASSWORD: ${{ secrets.PEUGEOT_KEY_PASSWORD }}
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Usar chave original quando configurada
        shell: bash
        run: |
          if [[ -n "$PEUGEOT_KEYSTORE_BASE64" ]]; then
            if [[ -z "$PEUGEOT_KEYSTORE_PASSWORD" || -z "$PEUGEOT_KEY_ALIAS" || -z "$PEUGEOT_KEY_PASSWORD" ]]; then
              echo 'ERRO: configure todos os quatro Secrets da assinatura.' >&2
              exit 1
            fi
            printf '%s' "$PEUGEOT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/peugeot-original.keystore"
            echo "PEUGEOT_KEYSTORE_FILE=$RUNNER_TEMP/peugeot-original.keystore" >> "$GITHUB_ENV"
            echo 'Assinatura original configurada.'
          else
            echo 'AVISO: APK sera assinado com chave DEBUG temporaria do GitHub.'
            echo 'Esse APK nao atualiza uma instalacao assinada com outra chave.'
          fi

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Conferir arquivo
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK e manifesto
        uses: actions/upload-artifact@v4
        with:
          name: Peugeot308Launcher-1.14-v114
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            update.json
          if-no-files-found: error
          retention-days: 30
