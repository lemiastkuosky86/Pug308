
name: Compilar Peugeot 308 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Peugeot 308
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      PEUGEOT_KEYSTORE_BASE64: ${{ secrets.PEUGEOT_KEYSTORE_BASE64 }}
      PEUGEOT_KEYSTORE_PASSWORD: ${{ secrets.PEUGEOT_KEYSTORE_PASSWORD }}
      PEUGEOT_KEY_ALIAS: ${{ secrets.PEUGEOT_KEY_ALIAS }}
      PEUGEOT_KEY_PASSWORD: ${{ secrets.PEUGEOT_KEY_PASSWORD }}

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar assinatura original
        shell: bash
        run: |
          if [[ -n "$PEUGEOT_KEYSTORE_BASE64" ]]; then

            if [[ -z "$PEUGEOT_KEYSTORE_PASSWORD" ||
                  -z "$PEUGEOT_KEY_ALIAS" ||
                  -z "$PEUGEOT_KEY_PASSWORD" ]]; then
              echo "ERRO: Faltam Secrets da assinatura."
              exit 1
            fi

            printf '%s' "$PEUGEOT_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$RUNNER_TEMP/peugeot-original.keystore"

            echo "PEUGEOT_KEYSTORE_FILE=$RUNNER_TEMP/peugeot-original.keystore" >> "$GITHUB_ENV"

            echo "Chave original configurada."
          else
            echo "AVISO: Compilando com assinatura DEBUG."
            echo "O APK pode nao atualizar uma instalacao existente."
          fi

      - name: Compilar Peugeot 308 Launcher
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificar APK gerado
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Peugeot308Launcher-1.14-v114
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            update.json
          if-no-files-found: error
          retention-days: 30
